[project]
name = "asset-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Skyzuo9", email = "3101065459@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cursor-sdk>=0.1.9",
    "ddgs>=9.14.4",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pygltflib>=1.16.5",
    "python-dotenv>=1.2.2",
    "streamlit>=1.59.1",
    "trimesh>=4.12.2",
]

[project.scripts]
asset-pipeline = "asset_pipeline:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-httpx>=0.36.2",
    "ruff>=0.15.21",
]
