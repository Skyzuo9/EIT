[project]
name = "eit-repro"
version = "0.1.0"
description = "Reproducible UniLab asset-pipeline and spatial-shadow checks"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fast-simplification>=0.1,<1",
  "jsonschema>=4.26,<5",
  "networkx>=3.6,<4",
  "numpy>=1.26,<3",
  "pyyaml>=6.0.3,<7",
  "scipy>=1.14,<2",
  "trimesh>=4.8,<5",
  "unilab-arm-cr5==0.1.0",
  "unilab-robot-contracts==0.1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
unilab-arm-cr5 = { path = "dependencies/unilab_robot_template/packages/unilab-arm-cr5" }
unilab-robot-contracts = { path = "dependencies/unilab_robot_template/packages/unilab-robot-contracts" }
